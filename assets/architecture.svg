<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="iot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="api" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="db" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#316192;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="react" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#61dafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="550" fill="#0f172a" rx="12"/>
  
  <text x="400" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="bold">Carnetruck Architecture</text>
  <text x="400" y="65" text-anchor="middle" fill="#94a3b8" font-size="14">IoT Cold-Chain Monitoring for Meat Exports</text>
  
  <!-- IoT Sensors -->
  <rect x="50" y="100" width="150" height="100" fill="url(#iot)" rx="8"/>
  <text x="125" y="135" text-anchor="middle" fill="white" font-size="14" font-weight="bold">IoT Sensors</text>
  <text x="125" y="155" text-anchor="middle" fill="#e0f2fe" font-size="11">NBM1 + BLE Tags</text>
  <text x="125" y="175" text-anchor="middle" fill="#e0f2fe" font-size="11">Temp, Humidity, GPS</text>
  <text x="125" y="190" text-anchor="middle" fill="#e0f2fe" font-size="10">Door, Tamper, Battery</text>
  
  <!-- Arrow -->
  <line x1="200" y1="150" x2="280" y2="150" stroke="#06b6d4" stroke-width="2"/>
  <text x="240" y="140" text-anchor="middle" fill="#64748b" font-size="10">HTTP/MQTT</text>
  
  <!-- FastAPI -->
  <rect x="280" y="100" width="160" height="100" fill="url(#api)" rx="8"/>
  <text x="360" y="135" text-anchor="middle" fill="white" font-size="14" font-weight="bold">FastAPI</text>
  <text x="360" y="155" text-anchor="middle" fill="#d1fae5" font-size="11">Python 3.12+</text>
  <text x="360" y="175" text-anchor="middle" fill="#d1fae5" font-size="11">JWT Auth + Multi-Tenant</text>
  <text x="360" y="190" text-anchor="middle" fill="#d1fae5" font-size="10">Rate Limiting + Tracking</text>
  
  <!-- Arrow -->
  <line x1="440" y1="150" x2="520" y2="150" stroke="#10b981" stroke-width="2"/>
  
  <!-- TimescaleDB -->
  <rect x="520" y="100" width="140" height="100" fill="url(#db)" rx="8"/>
  <text x="590" y="135" text-anchor="middle" fill="white" font-size="14" font-weight="bold">TimescaleDB</text>
  <text x="590" y="155" text-anchor="middle" fill="#bfdbfe" font-size="11">PostgreSQL 16</text>
  <text x="590" y="175" text-anchor="middle" fill="#bfdbfe" font-size="11">Hypertable + Alerts</text>
  <text x="590" y="190" text-anchor="middle" fill="#bfdbfe" font-size="10">SHA-256 Chain</text>
  
  <!-- Arrow to Frontend -->
  <line x1="360" y1="200" x2="360" y2="260" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Frontend -->
  <rect x="250" y="260" width="220" height="90" fill="url(#react)" rx="8"/>
  <text x="360" y="290" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="bold">Frontend</text>
  <text x="360" y="310" text-anchor="middle" fill="#1e293b" font-size="11">React 18 + Vite + Tailwind</text>
  <text x="360" y="330" text-anchor="middle" fill="#1e293b" font-size="11">Dashboard + Map + Charts</text>
  
  <!-- Services Section -->
  <text x="400" y="400" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="bold">Core Services</text>
  
  <rect x="50" y="420" width="140" height="50" fill="#1e293b" stroke="#06b6d4" stroke-width="1" rx="6"/>
  <text x="120" y="450" text-anchor="middle" fill="#22d3ee" font-size="11">Integrity Hash</text>
  
  <rect x="210" y="420" width="140" height="50" fill="#1e293b" stroke="#10b981" stroke-width="1" rx="6"/>
  <text x="280" y="450" text-anchor="middle" fill="#34d399" font-size="11">Alert Engine</text>
  
  <rect x="370" y="420" width="140" height="50" fill="#1e293b" stroke="#f59e0b" stroke-width="1" rx="6"/>
  <text x="440" y="450" text-anchor="middle" fill="#fbbf24" font-size="11">PDF Certificates</text>
  
  <rect x="530" y="420" width="140" height="50" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" rx="6"/>
  <text x="600" y="450" text-anchor="middle" fill="#a78bfa" font-size="11">Celery Workers</text>
  
  <rect x="690" y="420" width="80" height="50" fill="#1e293b" stroke="#ec4899" stroke-width="1" rx="6"/>
  <text x="730" y="450" text-anchor="middle" fill="#f472b6" font-size="11">MQTT</text>
  
  <!-- Footer -->
  <text x="400" y="520" text-anchor="middle" fill="#64748b" font-size="10">Docker Compose + Celery + Redis</text>
</svg>
