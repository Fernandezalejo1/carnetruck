name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: carnetruck
          POSTGRES_PASSWORD: carnetruck
          POSTGRES_DB: carnetruck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carnetruck -d carnetruck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test_carnetruck.db
          JWT_SECRET: test-secret
          ALERT_EVAL_MODE: sync
          ALERT_COOLDOWN_SECONDS: "0"
          SEED_DEMO: "false"
          AUTO_CREATE_TABLES: "false"
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/.coverage

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build
        run: |
          cd frontend
          npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t carnetruck-backend ./backend
      - name: Build frontend image
        run: docker build -t carnetruck-frontend ./frontend
